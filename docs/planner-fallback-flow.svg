<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
<title id="title">Planner selection and fallback</title><desc id="desc">The planner mode selects Qwen, Luna, or none. Auto tries Qwen, then Luna, then deterministic none when providers are unavailable.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#15243a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker><style>.t{font:700 32px Segoe UI,Arial;fill:#f8fafc}.s{font:400 16px Segoe UI,Arial;fill:#a9bad2}.h{font:700 19px Segoe UI,Arial;fill:#fff}.c{font:400 15px Segoe UI,Arial;fill:#dbeafe}.b{stroke:#7dd3fc;stroke-width:1.5}.p{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#a)}.d{fill:none;stroke:#fbbf24;stroke-width:2.5;stroke-dasharray:8 8;marker-end:url(#a)}</style></defs>
<rect width="1400" height="700" fill="url(#bg)"/><text x="60" y="60" class="t">Planner Selection and Fallback</text><text x="60" y="90" class="s">Planning is separate from execution routing; provider failure never has to abort the coding task.</text>
<rect x="70" y="175" width="230" height="120" rx="16" fill="#1e3a5f" class="b"/><text x="185" y="220" text-anchor="middle" class="h">Planner mode</text><text x="185" y="250" text-anchor="middle" class="c">qwen · luna · auto · none</text><text x="185" y="274" text-anchor="middle" class="c">user or config selection</text><path d="M300 235H380" class="p"/>
<rect x="380" y="130" width="245" height="110" rx="16" fill="#0d9488" class="b"/><text x="502" y="173" text-anchor="middle" class="h">Qwen local</text><text x="502" y="201" text-anchor="middle" class="c">llama-server · High</text><text x="502" y="223" text-anchor="middle" class="c">local Codex cost: 0</text>
<rect x="380" y="295" width="245" height="110" rx="16" fill="#475569" class="b"/><text x="502" y="338" text-anchor="middle" class="h">Luna</text><text x="502" y="366" text-anchor="middle" class="c">Codex CLI · Low</text><text x="502" y="388" text-anchor="middle" class="c">cloud planning fallback</text>
<rect x="380" y="460" width="245" height="110" rx="16" fill="#64748b" class="b"/><text x="502" y="503" text-anchor="middle" class="h">None</text><text x="502" y="531" text-anchor="middle" class="c">deterministic classification</text><text x="502" y="553" text-anchor="middle" class="c">no external planner</text>
<path d="M625 185H700M625 350H700M625 515H700" class="p"/><rect x="700" y="250" width="270" height="110" rx="16" fill="#2563eb" class="b"/><text x="835" y="292" text-anchor="middle" class="h">PlanningResult</text><text x="835" y="320" text-anchor="middle" class="c">features · files · plan</text><text x="835" y="342" text-anchor="middle" class="c">risks · confidence</text><path d="M970 305H1050" class="p"/>
<rect x="1050" y="250" width="280" height="110" rx="16" fill="#172033" class="b"/><text x="1190" y="292" text-anchor="middle" class="h">Routing policy</text><text x="1190" y="320" text-anchor="middle" class="c">final model + effort</text><text x="1190" y="342" text-anchor="middle" class="c">independent of provider</text>
<path d="M502 240V295M625 405V460" class="d"/><text x="660" y="278" class="c">offline / malformed</text><text x="660" y="443" class="c">fallback</text>
</svg>
