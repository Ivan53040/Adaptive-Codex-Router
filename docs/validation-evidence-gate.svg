<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">Validation and evidence gate</title><desc id="desc">A benchmark must fail at baseline, execute a model, capture committed or working-tree changes, run the official grader, and only then record success evidence.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#15243a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker><style>.t{font:700 32px Segoe UI,Arial;fill:#f8fafc}.s{font:400 16px Segoe UI,Arial;fill:#a9bad2}.h{font:700 18px Segoe UI,Arial;fill:#fff}.c{font:400 14px Segoe UI,Arial;fill:#dbeafe}.b{stroke:#7dd3fc;stroke-width:1.5}.p{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#a)}.d{fill:none;stroke:#fbbf24;stroke-width:2.5;stroke-dasharray:8 8;marker-end:url(#a)}</style></defs>
<rect width="1400" height="720" fill="url(#bg)"/><text x="60" y="60" class="t">Validation and Evidence Gate</text><text x="60" y="90" class="s">A result is comparable only when every evidence gate passes in order.</text>
<rect x="70" y="180" width="220" height="120" rx="16" fill="#c2410c" class="b"/><text x="180" y="225" text-anchor="middle" class="h">1. Baseline</text><text x="180" y="253" text-anchor="middle" class="c">Must fail at pinned</text><text x="180" y="275" text-anchor="middle" class="c">base commit</text><path d="M290 240H350" class="p"/>
<rect x="350" y="180" width="220" height="120" rx="16" fill="#2563eb" class="b"/><text x="460" y="225" text-anchor="middle" class="h">2. Execute</text><text x="460" y="253" text-anchor="middle" class="c">Planner + model act in</text><text x="460" y="275" text-anchor="middle" class="c">isolated workspace</text><path d="M570 240H630" class="p"/>
<rect x="630" y="180" width="220" height="120" rx="16" fill="#0d9488" class="b"/><text x="740" y="225" text-anchor="middle" class="h">3. Capture</text><text x="740" y="253" text-anchor="middle" class="c">Working-tree diff or</text><text x="740" y="275" text-anchor="middle" class="c">committed patch</text><path d="M850 240H910" class="p"/>
<rect x="910" y="180" width="220" height="120" rx="16" fill="#7c3aed" class="b"/><text x="1020" y="225" text-anchor="middle" class="h">4. Official grader</text><text x="1020" y="253" text-anchor="middle" class="c">Apply patch in pinned</text><text x="1020" y="275" text-anchor="middle" class="c">SWE-bench image</text><path d="M1130 240H1190" class="p"/>
<rect x="1190" y="180" width="150" height="120" rx="16" fill="#172033" class="b"/><text x="1265" y="225" text-anchor="middle" class="h">5. Record</text><text x="1265" y="253" text-anchor="middle" class="c">success +</text><text x="1265" y="275" text-anchor="middle" class="c">usage evidence</text>
<path d="M1020 300V420H740V300" class="d"/><text x="880" y="405" text-anchor="middle" class="c">unresolved → retry / escalate</text>
<rect x="70" y="470" width="1270" height="110" rx="16" fill="#172033" class="b"/><text x="705" y="510" text-anchor="middle" class="h">claims_ready gate</text><text x="705" y="540" text-anchor="middle" class="c">Real mode · 100 unique tasks · all eight categories · every required scenario · complete usage data</text>
</svg>
