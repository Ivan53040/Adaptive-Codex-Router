<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Phase 5 planner and routing matrix</title><desc id="desc">Phase 5 compares Qwen, Luna, and no planner with adaptive routing, plus fixed Sol and Astra controls.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#15243a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker><style>.t{font:700 32px Segoe UI,Arial;fill:#f8fafc}.s{font:400 16px Segoe UI,Arial;fill:#a9bad2}.h{font:700 16px Segoe UI,Arial;fill:#fff}.c{font:400 15px Segoe UI,Arial;fill:#dbeafe}.b{stroke:#7dd3fc;stroke-width:1.3}.p{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#a)}</style></defs>
<rect width="1400" height="820" fill="url(#bg)"/><text x="55" y="58" class="t">Phase 5 Planner and Routing Matrix</text><text x="55" y="88" class="s">The matrix isolates planning quality from execution routing and fixed-model controls.</text>
<rect x="55" y="135" width="215" height="54" rx="10" fill="#1e3a5f" class="b"/><text x="162" y="169" text-anchor="middle" class="h">Planner</text><rect x="280" y="135" width="250" height="54" rx="10" fill="#172554" class="b"/><text x="405" y="169" text-anchor="middle" class="h">Adaptive route</text><rect x="540" y="135" width="250" height="54" rx="10" fill="#334155" class="b"/><text x="665" y="169" text-anchor="middle" class="h">Fixed Sol control</text><rect x="800" y="135" width="250" height="54" rx="10" fill="#7c3aed" class="b"/><text x="925" y="169" text-anchor="middle" class="h">Fixed Astra control</text><rect x="1070" y="135" width="270" height="54" rx="10" fill="#172033" class="b"/><text x="1205" y="169" text-anchor="middle" class="h">Primary question</text>
<g><rect x="55" y="210" width="215" height="88" rx="12" fill="#0d9488" class="b"/><text x="162" y="245" text-anchor="middle" class="h">Qwen local High</text><text x="162" y="271" text-anchor="middle" class="c">0 Codex planning cost</text><rect x="280" y="210" width="250" height="88" rx="12" fill="#2563eb" class="b"/><text x="405" y="245" text-anchor="middle" class="h">Qwen + Adaptive</text><text x="405" y="271" text-anchor="middle" class="c">planner effect + routing</text><rect x="1070" y="210" width="270" height="88" rx="12" fill="#172033" class="b"/><text x="1205" y="245" text-anchor="middle" class="c">Does local planning improve</text><text x="1205" y="271" text-anchor="middle" class="c">first-attempt success?</text></g>
<g><rect x="55" y="320" width="215" height="88" rx="12" fill="#475569" class="b"/><text x="162" y="355" text-anchor="middle" class="h">Luna Low</text><text x="162" y="381" text-anchor="middle" class="c">Codex planning cost</text><rect x="280" y="320" width="250" height="88" rx="12" fill="#2563eb" class="b"/><text x="405" y="355" text-anchor="middle" class="h">Luna + Adaptive</text><text x="405" y="381" text-anchor="middle" class="c">cloud planning baseline</text><rect x="1070" y="320" width="270" height="88" rx="12" fill="#172033" class="b"/><text x="1205" y="355" text-anchor="middle" class="c">Does Qwen match Luna</text><text x="1205" y="381" text-anchor="middle" class="c">with less allowance?</text></g>
<g><rect x="55" y="430" width="215" height="88" rx="12" fill="#64748b" class="b"/><text x="162" y="465" text-anchor="middle" class="h">None</text><text x="162" y="491" text-anchor="middle" class="c">deterministic planning</text><rect x="280" y="430" width="250" height="88" rx="12" fill="#2563eb" class="b"/><text x="405" y="465" text-anchor="middle" class="h">None + Adaptive</text><text x="405" y="491" text-anchor="middle" class="c">routing-only baseline</text><rect x="540" y="430" width="250" height="88" rx="12" fill="#334155" class="b"/><text x="665" y="465" text-anchor="middle" class="h">None + Sol High</text><text x="665" y="491" text-anchor="middle" class="c">fixed strong control</text><rect x="800" y="430" width="250" height="88" rx="12" fill="#7c3aed" class="b"/><text x="925" y="465" text-anchor="middle" class="h">None + Astra Low</text><text x="925" y="491" text-anchor="middle" class="c">frontier control</text><rect x="1070" y="430" width="270" height="88" rx="12" fill="#172033" class="b"/><text x="1205" y="465" text-anchor="middle" class="c">Do savings come from</text><text x="1205" y="491" text-anchor="middle" class="c">planning, routing, or both?</text></g>
<path d="M270 254H280M530 254H540M790 474H800" class="p"/><rect x="55" y="590" width="1285" height="120" rx="16" fill="#172033" class="b"/><text x="697" y="630" text-anchor="middle" class="h">Every row records</text><text x="697" y="660" text-anchor="middle" class="c">success · first-attempt success · escalation · planner fallback · latency · local tokens · Codex tokens</text><text x="697" y="687" text-anchor="middle" class="c">Claims require real execution, 100 tasks, all eight categories, and complete required scenarios.</text>
</svg>
