<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Classifier calibration modes</title><desc id="desc">Sequential calibration makes one Codex call per task, while batch calibration sends all 40 tasks in one call and measures aggregate accuracy and token usage.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#15243a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker><style>.t{font:700 32px Segoe UI,Arial;fill:#f8fafc}.s{font:400 16px Segoe UI,Arial;fill:#a9bad2}.h{font:700 19px Segoe UI,Arial;fill:#fff}.c{font:400 15px Segoe UI,Arial;fill:#dbeafe}.b{stroke:#7dd3fc;stroke-width:1.5}.p{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#a)}</style></defs>
<rect width="1400" height="760" fill="url(#bg)"/><text x="60" y="60" class="t">Classifier Calibration</text><text x="60" y="90" class="s">The same classifier can be measured sequentially or with one batched Codex call.</text>
<rect x="70" y="150" width="580" height="430" rx="18" fill="#172033" class="b"/><text x="360" y="195" text-anchor="middle" class="h">Sequential mode</text><text x="360" y="225" text-anchor="middle" class="c">one Luna Low Codex call per task</text><g fill="#475569" class="b"><rect x="130" y="275" width="85" height="55" rx="10"/><rect x="235" y="275" width="85" height="55" rx="10"/><rect x="340" y="275" width="85" height="55" rx="10"/><rect x="445" y="275" width="85" height="55" rx="10"/></g><g class="c"><text x="172" y="309" text-anchor="middle">task 1</text><text x="277" y="309" text-anchor="middle">task 2</text><text x="382" y="309" text-anchor="middle">task 3</text><text x="487" y="309" text-anchor="middle">… task 40</text></g><text x="360" y="390" text-anchor="middle" class="h">Cost shape</text><text x="360" y="425" text-anchor="middle" class="c">fixed Codex context repeated per call</text><text x="360" y="460" text-anchor="middle" class="c">about 14.3k uncached input tokens / call</text><text x="360" y="525" text-anchor="middle" class="c">Best for: failure isolation and resumability</text>
<path d="M650 365H750" class="p"/>
<rect x="750" y="150" width="580" height="430" rx="18" fill="#172033" class="b"/><text x="1040" y="195" text-anchor="middle" class="h">Batch mode</text><text x="1040" y="225" text-anchor="middle" class="c">all 40 tasks in one Luna Low call</text><rect x="840" y="275" width="400" height="55" rx="10" fill="#2563eb" class="b"/><text x="1040" y="309" text-anchor="middle" class="c">40 task statements → one structured response</text><text x="1040" y="390" text-anchor="middle" class="h">Measured reference</text><text x="1040" y="425" text-anchor="middle" class="c">95% task-type accuracy · 95% exact route accuracy</text><text x="1040" y="460" text-anchor="middle" class="c">0 under-routes · 2 conservative over-routes</text><text x="1040" y="525" text-anchor="middle" class="c">16,931 input + 3,275 output tokens total</text>
<rect x="70" y="625" width="1260" height="65" rx="14" fill="#0d9488" class="b"/><text x="700" y="665" text-anchor="middle" class="h">Calibration measures planner/routing quality; it never invokes the coding executor.</text>
</svg>
