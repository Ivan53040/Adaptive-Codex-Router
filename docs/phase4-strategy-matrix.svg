<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Phase 4 coding strategy comparison</title><desc id="desc">Five coding strategies receive the same task and isolated Git worktree, then execute and validate before metrics are recorded.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#15243a"/></linearGradient><linearGradient id="blue"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient><linearGradient id="teal"><stop stop-color="#0d9488"/><stop offset="1" stop-color="#14b8a6"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker><style>.t{font:700 32px Segoe UI,Arial;fill:#f8fafc}.s{font:400 16px Segoe UI,Arial;fill:#a9bad2}.l{font:700 18px Segoe UI,Arial;fill:#fff}.x{font:400 14px Segoe UI,Arial;fill:#dbeafe}.b{stroke:#7dd3fc;stroke-width:1.5}.p{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#a)}</style></defs>
<rect width="1400" height="760" fill="url(#bg)"/><text x="60" y="60" class="t">Phase 4 Coding Strategy Comparison</text><text x="60" y="90" class="s">Every strategy receives the same task, base commit, workspace boundary, and objective validator.</text>
<rect x="60" y="145" width="210" height="90" rx="15" fill="#1e3a5f" class="b"/><text x="165" y="180" text-anchor="middle" class="l">Task + base commit</text><text x="165" y="207" text-anchor="middle" class="x">same input for every lane</text><path d="M270 190H330" class="p"/>
<rect x="330" y="145" width="220" height="90" rx="15" fill="#172554" class="b"/><text x="440" y="180" text-anchor="middle" class="l">Isolated Git worktree</text><text x="440" y="207" text-anchor="middle" class="x">fresh checkout per run</text><path d="M550 190H620" class="p"/>
<rect x="620" y="120" width="430" height="145" rx="18" fill="#172033" class="b"/><text x="835" y="155" text-anchor="middle" class="l">Five execution strategies</text>
<rect x="650" y="178" width="72" height="42" rx="9" fill="#475569"/><text x="686" y="204" text-anchor="middle" class="x">Luna</text><rect x="735" y="178" width="72" height="42" rx="9" fill="#475569"/><text x="771" y="204" text-anchor="middle" class="x">Terra</text><rect x="820" y="178" width="72" height="42" rx="9" fill="#475569"/><text x="856" y="204" text-anchor="middle" class="x">Sol</text><rect x="905" y="178" width="72" height="42" rx="9" fill="#7c3aed"/><text x="941" y="204" text-anchor="middle" class="x">Astra</text><rect x="990" y="178" width="42" height="42" rx="9" fill="url(#teal)"/><text x="1011" y="204" text-anchor="middle" class="x">Adaptive</text>
<path d="M835 265V315" class="p"/><rect x="620" y="315" width="430" height="90" rx="15" fill="url(#blue)" class="b"/><text x="835" y="350" text-anchor="middle" class="l">Execute with model + effort</text><text x="835" y="378" text-anchor="middle" class="x">capture files, tokens, latency, exit state</text><path d="M835 405V455" class="p"/>
<rect x="620" y="455" width="430" height="90" rx="15" fill="#c2410c" class="b"/><text x="835" y="490" text-anchor="middle" class="l">Objective validation</text><text x="835" y="518" text-anchor="middle" class="x">tests, required output, changed files</text><path d="M620 500H470V610H620" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#a)"/><text x="470" y="592" text-anchor="middle" class="x">failure / escalate</text>
<rect x="620" y="610" width="430" height="80" rx="15" fill="#172033" class="b"/><text x="835" y="643" text-anchor="middle" class="l">Comparable metrics</text><text x="835" y="669" text-anchor="middle" class="x">success · first attempt · usage · efficiency</text>
</svg>
